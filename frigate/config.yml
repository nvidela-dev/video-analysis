database:
  path: /config/db/frigate.db
# Replay the local sample as a camera.
mqtt:
  enabled: false
detectors:
  cpu:
    type: cpu
cameras:
  counter:
    ffmpeg:
      inputs:
        - path: /samples/barista-solo.mp4
          input_args: -re -stream_loop -1 -fflags +genpts
          roles: [detect, record]
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    objects:
      track: [person]
    record:
      enabled: true
      retain:
        days: 2
        mode: all
