database:
  path: /config/db/frigate.db
# Replay the local sample as a camera.
mqtt:
  enabled: false
detectors:
  cpu:
    type: cpu
cameras:
  counter:
    ffmpeg:
      inputs:
        - path: /samples/barista-solo.mp4
          input_args: -re -stream_loop -1 -fflags +genpts
          roles: [detect, record]
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    objects:
      track: [person]
    record:
      enabled: true
      retain:
        days: 2
        mode: all
    zones:
      behind_counter:
        coordinates: 0.20,0.28,0.53,0.28,0.53,1,0.14,1
        objects: [person]
        inertia: 3
      customer_side:
        coordinates: 0.69,0.48,1,0.48,1,1,0.59,1
        objects: [person]
        inertia: 3
      doorway:
        coordinates: 0.76,0.30,0.97,0.30,0.97,0.84,0.74,0.84
        objects: [person]
        inertia: 3
